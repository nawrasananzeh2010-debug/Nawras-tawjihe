<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07061a">
  <title>إنجاز نورس</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .wrap { max-width: 980px; padding-bottom: 40px; }
    .ttl { text-align: center; margin: 6px 0 4px; font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 900; }
    .upd { text-align: center; color: var(--dim); font-size: .85rem; margin-bottom: 18px; }
    .sc .top2 { display: flex; align-items: center; gap: 12px; }
    .sc .pct { margin-inline-start: auto; font-size: 2.1rem; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
    .sc .pct small { font-size: 1rem; color: var(--muted); }
    .sc .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .9rem; margin-top: 8px; flex-wrap: wrap; gap: 6px; }
    .ls { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; margin-top: 14px; }
    .l { position: relative; border-radius: 12px; padding: 8px 6px; text-align: center; background: rgba(255,255,255,.04); border: 1px solid var(--card-b); overflow: hidden; }
    .l .f { position: absolute; inset: auto 0 0 0; height: var(--p); background: color-mix(in srgb, var(--c) 45%, transparent); }
    .l.done { border-color: var(--c); }
    .l b, .l span { position: relative; display: block; }
    .l b { font-size: .82rem; }
    .l span { font-size: .95rem; font-weight: 900; }
    .l span.z { color: var(--dim); font-weight: 600; font-size: .8rem; }
    .l.done b::after { content: " ✓"; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="ttl">📚 إنجاز <span class="grad">نورس</span></div>
  <div class="upd" id="upd">جارِ التحميل…</div>
  <div class="grid" id="subjects" style="gap:16px"></div>
</div>

<script src="config.js"></script>
<script src="core.js"></script>
<script>
{
  const T = TJ, $ = (s) => document.querySelector(s);
  const SEEN = "tj_dad_seen_" + T.CFG.channelId;
  let seen = 0; try { seen = +(localStorage.getItem(SEEN) || 0); } catch {}
  let st = T.loadLocal(), booted = false, first = true;
  T.starfield();

  function render() {
    $("#upd").textContent = st.ts ? "آخر تحديث: " + T.relTime(st.ts) : "لسا نورس ما سجّل إنجاز";
    $("#subjects").innerHTML = T.SUBJECTS.map((s, i) => {
      const a = T.semInfo(st, s.id, "s1"), prog = st.p[s.id].s1, pps = st.pp[s.id].s1;
      const pages = pps.reduce((x, y) => x + y, 0);
      const cells = [...prog].map((c, k) => `<div class="l ${c === "4" ? "done" : ""}" style="--p:${+c * 25}%">
          <div class="f"></div><b>الدرس ${k + 1}</b>${pps[k] ? `<span>${pps[k]} ص</span>` : `<span class="z">—</span>`}</div>`).join("");
      return `<div class="card sc ${first ? `reveal d${i + 1}` : ""}" style="--c:${s.color}">
        <div class="top2"><div class="logo" style="background:${s.color};animation:none">${s.icon}</div><h3>${s.name}</h3>
          <div class="pct">${a.pct.toFixed(0)}<small>%</small></div></div>
        <div class="bar mt" style="--c:${s.color}"><i style="width:${a.pct}%"></i></div>
        <div class="meta"><span>خلّص <b>${a.done}</b> من <b>${a.n}</b> درس</span><span>📄 مجموع الصفحات: <b>${pages}</b></span></div>
        <div class="ls">${cells}</div></div>`;
    }).join("");
    document.querySelectorAll(".bar > i").forEach((el) => { const w = el.style.width; el.style.width = "0"; requestAnimationFrame(() => requestAnimationFrame(() => (el.style.width = w))); });
    T.reveal(); first = false;
  }

  function checkNew(src) {
    const last = st.log[st.log.length - 1];
    if (!last) return;
    if (last.t > seen && booted && src === "remote") {
      const s = T.SUBJ[last.s] || {};
      const txt = `نورس ${last.pg ? `أنجز ${last.pg} صفحة ${s.name}` : `تقدّم في ${s.name}`}`;
      T.toast("🎉 " + txt); T.chime();
      if ("Notification" in window && Notification.permission === "granted") { try { new Notification("إنجاز جديد من نورس 🎉", { body: txt }); } catch {} }
    }
    seen = Math.max(seen, last.t); try { localStorage.setItem(SEEN, seen); } catch {}
  }

  T.Store.init({ role: "dad", onState: (s, src) => { st = s; render(); checkNew(src); }, onMsg: () => {}, onStatus: () => {} });
  render();
  setTimeout(() => (booted = true), 2500);
  setInterval(() => { if (st.ts) $("#upd").textContent = "آخر تحديث: " + T.relTime(st.ts); }, 30000);
  // إذن الإشعارات بأول لمسة على الصفحة
  document.addEventListener("click", () => { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); }, { once: true });
}
</script>
</body>
</html>
